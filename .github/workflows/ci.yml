name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install ruff==0.14.2 pytest==9.1.1
      - run: ruff check src tests
      - run: pytest
      - run: python -m pip check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag acmeflow-rag:ci .
      - name: Container smoke test with mounted local fixtures
        run: |
          mkdir -p .docker-smoke-artifacts
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/data:/app/data:ro" \
            -v "$PWD/.docker-smoke-artifacts:/app/artifacts" \
            acmeflow-rag:ci python -m acmeflow_rag.ingest \
            --retriever tfidf --corpus data/documents_v3 --artifacts-dir artifacts \
            --max-words 40 --overlap-words 10 --corpus-version v3 --require-lifecycle
          cleanup() {
            docker rm -f acmeflow-rag-smoke >/dev/null 2>&1 || true
          }
          diagnose() {
            echo "::group::Container logs"
            docker logs acmeflow-rag-smoke 2>&1 || true
            echo "::endgroup::"
            echo "::group::Container inspect"
            docker inspect acmeflow-rag-smoke 2>&1 || true
            echo "::endgroup::"
            exit_code="$(docker inspect --format '{{.State.ExitCode}}' acmeflow-rag-smoke 2>/dev/null || echo unavailable)"
            state="$(docker inspect --format '{{.State.Status}}' acmeflow-rag-smoke 2>/dev/null || echo unavailable)"
            echo "container_state=$state"
            echo "container_exit_code=$exit_code"
          }
          trap cleanup EXIT
          docker run -d --name acmeflow-rag-smoke -p 8080:8080 \
            -v "$PWD/data/identity:/app/data/identity:ro" \
            -v "$PWD/.docker-smoke-artifacts:/app/artifacts:ro" \
            acmeflow-rag:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready; then exit 0; fi
            if [ "$(docker inspect --format '{{.State.Running}}' acmeflow-rag-smoke 2>/dev/null || echo false)" != "true" ]; then
              echo "Service container stopped before becoming ready."
              diagnose
              exit 1
            fi
            sleep 2
          done
          echo "Service container did not become ready before the timeout."
          diagnose
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --verbose --log-opts="--all" .
