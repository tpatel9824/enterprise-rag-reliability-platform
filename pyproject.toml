[project]
name = "acmeflow-enterprise-rag"
version = "0.1.0"
description = "Phase 1 enterprise RAG system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "PyYAML>=6.0",
  "google-genai>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
