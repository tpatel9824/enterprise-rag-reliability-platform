[project]
name = "acmeflow-enterprise-rag"
version = "0.6.0"
description = "Evidence-grounded enterprise RAG reliability and governance platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "PyYAML>=6.0",
  "sentence-transformers>=3.3",
  "faiss-cpu>=1.9",
  "google-genai>=1.0"
]

[project.optional-dependencies]
cloud = ["google-cloud-storage==3.17.0", "PyJWT[crypto]==2.10.1"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.14.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
